services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:3004,http://127.0.0.1:3004
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3004:3004"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command: >
      sh -c "npm install && npm run dev -- -p 3004"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3004
    restart: unless-stopped
