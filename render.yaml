services:
  - type: web
    name: temporal-spanner-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://frontend-teal-iota-ee3dg8j6wx.vercel.app,http://localhost:3004
    plan: free
    region: frankfurt
