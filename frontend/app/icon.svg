<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Minimal line-drawing mark: a small temporal graph -- a dense
       triangle-and-node cluster on the left thinning to a single spanning
       line on the right, echoing the clique-to-spanner reduction the tool
       is named for. Single-color ink stroke, no fills, so it reads at
       favicon size and stays legible on both light and dark tab chrome. -->
  <circle cx="6" cy="9" r="2" fill="#1c1a16"/>
  <circle cx="6" cy="23" r="2" fill="#1c1a16"/>
  <circle cx="15" cy="16" r="2" fill="#1c1a16"/>
  <circle cx="26" cy="16" r="2" fill="#1c1a16"/>
  <path d="M6 9 L6 23 M6 9 L15 16 M6 23 L15 16 M15 16 L26 16"
        stroke="#1c1a16" stroke-width="1.6" stroke-linecap="round"/>
</svg>
